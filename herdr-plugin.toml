id = "alherdr.agent-alerts"
name = "Agent Alerts"
version = "0.2.0"
min_herdr_version = "0.9.1"
description = "Alert a detected agent's blocked or done state to Telegram, with a real extract of the agent's own output."
platforms = ["linux", "macos"]

# One hook covers every agent Herdr detects: pi, claude, codex, and the rest.
[[events]]
on = "pane.agent_status_changed"
command = ["node", "src/notify.mjs"]

# Stop and crash. pane.agent_detected also fires when an agent is DETECTED, so the
# dispatcher only alerts when the event reports released = true.
[[events]]
on = "pane.agent_detected"
command = ["node", "src/notify.mjs"]

# The pane's foreground process ended: a crash, an exit, or Ctrl-D.
[[events]]
on = "pane.exited"
command = ["node", "src/notify.mjs"]

[[actions]]
id = "toggle"
title = "Agent Alerts: toggle alerts"
contexts = ["global"]
command = ["node", "src/actions.mjs", "toggle"]

[[actions]]
id = "enable"
title = "Agent Alerts: enable alerts"
contexts = ["global"]
command = ["node", "src/actions.mjs", "enable"]

[[actions]]
id = "disable"
title = "Agent Alerts: disable alerts"
contexts = ["global"]
command = ["node", "src/actions.mjs", "disable"]

[[actions]]
id = "send-test"
title = "Agent Alerts: send a test alert"
contexts = ["global"]
command = ["node", "src/actions.mjs", "send-test"]

# Reports the switch, whether credentials are set, the poller heartbeat and
# who is waiting. Sends nothing: checking the switch must never alert.
[[actions]]
id = "status"
title = "Agent Alerts: show status"
contexts = ["global"]
command = ["node", "src/actions.mjs", "status"]

# The setup wizard, runnable straight from the Herdr CLI:
#   herdr plugin pane open --plugin alherdr.agent-alerts --entrypoint setup
#
# A pane rather than an action, because an action has no terminal at all: stdin,
# stdout and stderr are every one of them captured, so an interactive wizard would
# fail at its first prompt. A pane is measured to give a terminal on stdin and
# stderr, and Herdr renders both streams, so the wizard's prompts and output work.
# One cosmetic caveat, measured and not yet worked around: Herdr keeps stdout on a
# pipe even if the command redirects it, so the wizard's own "is stdout a terminal"
# checks see false. It therefore runs without colour and without clearing between
# stages, which makes the five steps scroll instead of replace.
[[panes]]
id = "setup"
title = "Agent Alerts setup"
placement = "popup"
width = "80%"
height = "80%"
command = ["bash", "scripts/wizard.sh"]
